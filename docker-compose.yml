services:
  # Serviço de Dashboard Web
  dashboard:
    build: .
    command: node src/server.js
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - .:/app
      - /app/node_modules
    dns:
      - 8.8.8.8
    networks:
      - hero-network
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Serviço da CLI (Executado sob demanda)
  cli:
    build: .
    command: node src/index.js
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - .:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    dns:
      - 8.8.8.8
    networks:
      - hero-network
    depends_on:
      neo4j:
        condition: service_healthy

  # Banco de Dados de Grafos Neo4j
  neo4j:
    image: neo4j:latest
    ports:
      - "7474:7474" # Painel administrativo (HTTP)
      - "7687:7687" # Conexão Bolt (Protocolo binário)
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - neo4j_data:/data
    networks:
      - hero-network
    healthcheck:
      # Checa o endpoint HTTP de discovery — disponível assim que o core sobe,
      # sem depender do cypher-shell que varia entre versões do Neo4j.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7474"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 40s

  # ─── Observabilidade ──────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    networks:
      - hero-network
    depends_on:
      dashboard:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    ports:
      - "4000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - hero-network
    depends_on:
      - prometheus

networks:
  hero-network:
    driver: bridge

volumes:
  neo4j_data:
  prometheus_data:
  grafana_data:
